{% extends "base.html" %}
{% load static %}
{% block content %}
    <style>
        /* Prevent horizontal scrolling globally */
        body {
            background: #2d1537;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
            max-width: 100vw;
        }
        
        /* Ensure all containers respect viewport width */
        .container, .max-w-6xl, .max-w-4xl, .max-w-3xl {
            max-width: 100vw;
            box-sizing: border-box;
        }
        .brand-font { font-family: 'Playfair Display', serif; }
        .brand-gradient {
            background: linear-gradient(90deg, #a259c6, #e16b8c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .carousel-container {
            position: relative;
            width: 100vw;
            height: 60vh;
            overflow: hidden;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #2d1537 0%, #1a0823 100%);
            left: 50%;
            right: 50%;
            margin-left: -50vw;
            margin-right: -50vw;
        }
        
        @media (max-width: 640px) {
            .carousel-container {
                height: 30vh;
                width: 100%;
                left: 0;
                right: 0;
                margin-left: 0;
                margin-right: 0;
            }
        }
        
        @media (min-width: 641px) and (max-width: 1024px) {
            .carousel-container {
                height: 40vh;
                width: 100vw;
            }
        }
        
        @media (min-width: 1025px) {
            .carousel-container {
                height: 50vh;
                width: 100vw;
            }
        }
        .carousel-slide {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0;
            transition: opacity 1s cubic-bezier(.4,0,.2,1);
            z-index: 1;
        }
        .carousel-slide.active {
            opacity: 1;
            z-index: 2;
        }
        .carousel-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            background: #1a0823;
        }
        
        @media (max-width: 640px) {
            .carousel-img {
                object-position: center top;
            }
        }
        .carousel-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, rgba(45,21,55,0.8) 0%, rgba(26,8,35,0.4) 50%, rgba(45,21,55,0.6) 100%);
            z-index: 3;
        }
        .carousel-dots {
            position: absolute; 
            bottom: 20px; 
            left: 50%; 
            transform: translateX(-50%);
            display: flex; 
            gap: 8px; 
            z-index: 10;
        }
        
        @media (min-width: 640px) {
            .carousel-dots {
                bottom: 24px;
                gap: 10px;
            }
        }
        
        @media (min-width: 768px) {
            .carousel-dots {
                bottom: 32px;
                gap: 12px;
            }
        }
        .carousel-dot {
            width: 10px; 
            height: 10px; 
            border-radius: 50%; 
            background: #fff; 
            opacity: 0.4; 
            cursor: pointer; 
            transition: all 0.3s ease;
        }
        
        @media (min-width: 640px) {
            .carousel-dot {
                width: 12px;
                height: 12px;
            }
        }
        
        @media (min-width: 768px) {
            .carousel-dot {
                width: 14px;
                height: 14px;
            }
        }
        .carousel-dot.active { opacity: 1; background: #e16b8c; }
        .carousel-arrow {
            position: absolute; 
            top: 50%; 
            transform: translateY(-50%);
            background: rgba(0,0,0,0.4); 
            color: #fff; 
            border: none; 
            border-radius: 50%; 
            width: 32px; 
            height: 32px;
            font-size: 1.1rem; 
            z-index: 10; 
            cursor: pointer; 
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .carousel-arrow:hover {
            background: rgba(225, 107, 140, 0.8);
            transform: translateY(-50%) scale(1.1);
        }
        
        @media (min-width: 640px) {
            .carousel-arrow {
                width: 40px; 
                height: 40px;
                font-size: 1.3rem;
            }
        }
        
        @media (min-width: 768px) {
            .carousel-arrow {
                width: 48px; 
                height: 48px;
                font-size: 1.5rem;
            }
        }
        
        @media (min-width: 1024px) {
            .carousel-arrow {
                width: 56px; 
                height: 56px;
                font-size: 1.8rem;
            }
        }
        .carousel-arrow:hover { background: #e16b8c; }
        .carousel-arrow.left { left: 16px; }
        .carousel-arrow.right { right: 16px; }
        
        @media (min-width: 640px) {
            .carousel-arrow.left { left: 24px; }
            .carousel-arrow.right { right: 24px; }
        }
        
        @media (min-width: 768px) {
            .carousel-arrow.left { left: 32px; }
            .carousel-arrow.right { right: 32px; }
        }
        
        @media (min-width: 1024px) {
            .carousel-arrow.left { left: 48px; }
            .carousel-arrow.right { right: 48px; }
        }

        .fade-in-up { opacity: 0; transform: translateY(40px); transition: opacity 0.8s, transform 0.8s; }
        .fade-in-up.visible { opacity: 1; transform: translateY(0); }
        .category-card {
            background: #1a0823;
            border-radius: 1.5rem;
            box-shadow: 0 4px 24px rgba(0,0,0,0.15);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .category-card:hover { transform: translateY(-6px) scale(1.03); box-shadow: 0 8px 32px 0 rgba(226,107,140,0.25), 0 1.5px 8px 0 rgba(162,89,198,0.15); z-index: 2; }
        .footer-link { color: #fff; opacity: 0.8; transition: opacity 0.2s; }
        .footer-link:hover { opacity: 1; }
        .footer-bg { background: #12071a; }
        .search-btn { background: #a259c6; color: #fff; border-radius: 1rem; padding: 0.5rem 2rem; font-size: 1.2rem; }
        .search-btn:hover { background: #e16b8c; }
        .partner-box { background: #6d4a7b; border-radius: 1rem; padding: 2rem; color: #fff; font-size: 1.3rem; }
        .newsletter-input { border-radius: 2rem 0 0 2rem; padding: 0.7rem 1.2rem; border: none; width: 70%; }
        .newsletter-btn { border-radius: 0 2rem 2rem 0; background: #a259c6; color: #fff; padding: 0.7rem 2rem; border: none; }
        .newsletter-btn:hover { background: #e16b8c; }
    </style>
    <!-- Hero Carousel Section -->
    <div class="carousel-container">
        <div class="carousel-slide active"><img src="{% static 'lip_products/sw1.JPG' %}" class="carousel-img" alt="Slide 1"></div>
        <div class="carousel-slide"><img src="{% static 'lip_products/sw2.JPG' %}" class="carousel-img" alt="Slide 2"></div>
        <div class="carousel-slide"><img src="{% static 'lip_products/sw3.JPG' %}" class="carousel-img" alt="Slide 3"></div>
        <div class="carousel-slide"><img src="{% static 'lip_products/sw4.JPG' %}" class="carousel-img" alt="Slide 4"></div>
        <div class="carousel-overlay"></div>
        
        <button class="carousel-arrow left" id="carousel-prev">&#8592;</button>
        <button class="carousel-arrow right" id="carousel-next">&#8594;</button>
        <div class="carousel-dots">
            <span class="carousel-dot active"></span>
            <span class="carousel-dot"></span>
            <span class="carousel-dot"></span>
            <span class="carousel-dot"></span>
        </div>
    </div>
    <!-- Search Bar -->
    <div class="flex justify-center mt-4 sm:mt-6 mb-6 sm:mb-8 z-20 relative fade-in-up px-4 sm:px-6 lg:px-8">
        <form action="{% url 'store:search' %}" method="get" class="flex w-full max-w-sm sm:max-w-md lg:max-w-lg">
            <input type="text" name="q" placeholder="Search" class="flex-1 px-3 sm:px-4 md:px-6 py-2.5 sm:py-3 rounded-l-full bg-white/95 backdrop-blur-sm text-gray-800 focus:outline-none text-sm sm:text-base border border-white/20 shadow-lg" />
            <button type="submit" class="search-btn rounded-r-full text-sm sm:text-base px-2 sm:px-3 md:px-6 py-2.5 sm:py-3 shadow-lg">Search</button>
        </form>
    </div>
    <!-- Products by Category -->
    <section class="max-w-6xl mx-auto mb-8 sm:mb-12 fade-in-up px-4 sm:px-6 lg:px-8">
        <div class="text-center mb-6 sm:mb-8">
            <span class="brand-font text-base sm:text-lg md:text-xl lg:text-2xl tracking-wider" style="background: #bca4cb; color: #2d1537; border-radius: 0.75rem sm:1rem; padding: 0.5rem 1rem sm:0.75rem 1.5rem md:1rem 2rem;">PRODUCTS BY CATEGORY</span>
        </div>
        <div class="grid grid-cols-2 sm:grid-cols-2 lg:grid-cols-4 gap-4 sm:gap-6 md:gap-8">
            {% for category in categories %}
            <a href="/category/{{ category.slug }}/products/" class="category-card flex flex-col items-center p-3 sm:p-4 md:p-6 text-center">
                {% if category.image %}
                    <img src="{{ category.image.url }}" alt="{{ category.name }}" class="w-20 h-20 sm:w-24 sm:h-24 md:w-32 md:h-32 lg:w-40 lg:h-40 object-cover rounded-lg sm:rounded-xl mb-3 sm:mb-4 border-2 sm:border-4 border-purple-200">
                {% else %}
                    <img src="{% static 'lip_products/aurora-crystal.jpg' %}" alt="{{ category.name }}" class="w-20 h-20 sm:w-24 sm:h-24 md:w-32 md:h-32 lg:w-40 lg:h-40 object-cover rounded-lg sm:rounded-xl mb-3 sm:mb-4 border-2 sm:border-4 border-purple-200">
                {% endif %}
                <span class="brand-font text-sm sm:text-base md:text-lg lg:text-xl xl:text-2xl mb-1 sm:mb-2" style="color: #e16b8c;">{{ category.name|title }}</span>
            </a>
            {% empty %}
            <div class="col-span-2 text-center text-base sm:text-lg text-gray-300">No categories available.</div>
            {% endfor %}
        </div>
    </section>
    <!-- Partners Section -->
    <section class="max-w-4xl mx-auto mb-8 sm:mb-12 fade-in-up px-4 sm:px-6 lg:px-8">
        <div class="text-center mb-4 sm:mb-6 brand-font text-sm sm:text-base md:text-lg lg:text-xl tracking-wider" style="background: #bca4cb; color: #2d1537; border-radius: 0.75rem sm:1rem; padding: 0.5rem 1rem sm:0.75rem 1.5rem md:1rem 2rem;">PARTNERS</div>
        <div class="partner-box text-center p-4 sm:p-6 md:p-8 lg:p-10 text-sm sm:text-base md:text-lg lg:text-xl">List of partners</div>
    </section>
    <script>
        // Carousel logic
        const slides = document.querySelectorAll('.carousel-slide');
        const dots = document.querySelectorAll('.carousel-dot');
        const prevBtn = document.getElementById('carousel-prev');
        const nextBtn = document.getElementById('carousel-next');
        let currentSlide = 0;
        let carouselInterval;
        function showSlide(idx) {
            slides.forEach((slide, i) => {
                slide.classList.toggle('active', i === idx);
                dots[i].classList.toggle('active', i === idx);
            });
            currentSlide = idx;
        }
        function nextSlide() {
            let next = (currentSlide + 1) % slides.length;
            showSlide(next);
        }
        function prevSlide() {
            let prev = (currentSlide - 1 + slides.length) % slides.length;
            showSlide(prev);
        }
        function startCarousel() {
            carouselInterval = setInterval(nextSlide, 3000);
        }
        function stopCarousel() {
            clearInterval(carouselInterval);
        }
        dots.forEach((dot, idx) => {
            dot.addEventListener('click', () => {
                showSlide(idx);
                stopCarousel();
                startCarousel();
            });
        });
        nextBtn.addEventListener('click', () => { nextSlide(); stopCarousel(); startCarousel(); });
        prevBtn.addEventListener('click', () => { prevSlide(); stopCarousel(); startCarousel(); });
        showSlide(0);
        startCarousel();
        // Scroll-triggered fade-in-up animations
        function revealOnScroll() {
            document.querySelectorAll('.fade-in-up').forEach(el => {
                const rect = el.getBoundingClientRect();
                if (rect.top < window.innerHeight - 60) {
                    el.classList.add('visible');
                }
            });
        }
        window.addEventListener('scroll', revealOnScroll);
        window.addEventListener('load', revealOnScroll);
    </script>
{% endblock %}
